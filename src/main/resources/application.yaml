ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - inc.dimasic.taskcal.backend.ApplicationKt.module

database:
  url: "$DB_URL:jdbc:postgresql://localhost:5432/taskcal"
  # Empty user means the PostgreSQL driver falls back to the OS user (Homebrew's default role).
  user: "$DB_USER:"
  password: "$DB_PASSWORD:"
  maxPoolSize: 10
