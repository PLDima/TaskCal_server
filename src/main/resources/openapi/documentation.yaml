openapi: 3.0.3
info:
  title: TaskCal API
  version: 1.0.0
  description: |
    Backend for the TaskCal Android app.

    **Auth (v1):** the app generates a random device token (32–256 chars) on install, registers it
    once with `POST /api/v1/auth/device`, and sends it as `Authorization: Bearer <token>` on every
    other call. The server stores only a SHA-256 hash of the token.

    **IDs** are UUIDs generated by the client; `PUT` creates or replaces the resource at that id.
    Date-times are zone-less ISO-8601 (`2026-11-09T07:30:00`); dates are `yyyy-MM-dd`.
servers:
  - url: /api/v1
security:
  - deviceToken: []

paths:
  /auth/device:
    post:
      tags: [Auth]
      summary: Register a device token (idempotent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceAuthRequest' }
      responses:
        '200': { description: The user this token signs in as, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me:
    get:
      tags: [Account]
      summary: The calling user
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Account]
      summary: Delete the account and all of its data
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/profile:
    get:
      tags: [Account]
      summary: Get the profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Account]
      summary: Create or replace the profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfile' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks:
    get:
      tags: [Tasks]
      summary: List all tasks
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Task' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get a task
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tasks]
      summary: Create or replace a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Task' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Delete a task and its completions
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{taskId}/completions:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: List completions of a repeating task
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaskCompletion' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{taskId}/completions/{completionId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: completionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Tasks]
      summary: Record (or replace) the completion of one occurrence
      description: Only repeating tasks have completions. One completion per occurrenceDate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCompletion' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCompletion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Tasks]
      summary: Delete a completion
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /food-entries:
    get:
      tags: [Food]
      summary: List food entries, optionally within a date range (inclusive)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FoodEntry' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /food-entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Food]
      summary: Get a food entry
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FoodEntry' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Food]
      summary: Create or replace a food entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodEntry' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/FoodEntry' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Food]
      summary: Delete a food entry
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed input or a broken validation rule
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing or unknown device token
    NotFound:
      description: Doesn't exist for the calling user
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Conflicts with the current state
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    DeviceAuthRequest:
      type: object
      required: [deviceToken]
      properties:
        deviceToken: { type: string, minLength: 32, maxLength: 256 }

    User:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }

    Task:
      type: object
      required: [title, priority]
      properties:
        id: { type: string, format: uuid, description: 'Taken from the URL on writes; must match if sent' }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000, default: '' }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
        recurrenceType: { type: string, enum: [NONE, DAILY, WEEKLY, MONTHLY], default: NONE }
        repeatDayOfWeek: { type: string, nullable: true, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY], description: WEEKLY only }
        repeatDayOfMonth: { type: integer, nullable: true, minimum: 1, maximum: 31, description: MONTHLY only }
        assignedDateTime: { type: string, nullable: true, example: '2026-11-09T07:30:00', description: 'Zone-less; for repeating tasks, the start of the series' }
        hasDueTime: { type: boolean, default: false }
        isCompleted: { type: boolean, default: false, description: Non-repeating tasks only }

    TaskCompletion:
      type: object
      required: [occurrenceDate, completedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        occurrenceDate: { type: string, example: '2026-11-09T07:30:00' }
        completedAt: { type: string, example: '2026-11-09T08:05:00' }

    FoodEntry:
      type: object
      required: [date, mealType, calories, protein, carbs, fat, name]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        mealType: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK] }
        calories: { type: integer, minimum: 0 }
        protein: { type: number, minimum: 0 }
        carbs: { type: number, minimum: 0 }
        fat: { type: number, minimum: 0 }
        name: { type: string, maxLength: 200 }

    UserProfile:
      type: object
      required: [stepsGoal, distanceGoalMeters, caloriesBurnedGoal, weightGoal, nutritionGoal]
      properties:
        name: { type: string, maxLength: 100, default: '' }
        gender: { type: string, nullable: true, enum: [MALE, FEMALE, OTHER] }
        dateOfBirth: { type: string, format: date, nullable: true }
        heightCm: { type: integer, nullable: true, minimum: 30, maximum: 300 }
        stepsGoal: { type: integer, minimum: 0 }
        distanceGoalMeters: { type: integer, minimum: 0 }
        caloriesBurnedGoal: { type: integer, minimum: 0 }
        weightGoal: { type: number, exclusiveMinimum: true, minimum: 0 }
        nutritionGoal:
          type: object
          required: [calories, protein, carbs, fat]
          properties:
            calories: { type: integer, minimum: 0 }
            protein: { type: number, minimum: 0 }
            carbs: { type: number, minimum: 0 }
            fat: { type: number, minimum: 0 }

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, nullable: true }
        errors: { type: array, nullable: true, items: { type: string } }
